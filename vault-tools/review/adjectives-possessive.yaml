  - type: explain_difference
    topic: Adjectives
    subtopic: Dele/dela/deles/delas disambiguate seu/sua
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain how Brazilians commonly avoid the ambiguity of seu/sua when
      they want to be clear about whose car or house they mean."
    model_answers:
      - "Instead of the ambiguous seu/sua, Brazilians often use dele (his), dela
        (hers), deles (theirs, masculine/mixed), or delas (theirs, feminine)
        placed after the noun — e.g. O carro dele (his car) or A bolsa dela (her
        handbag) — which removes the ambiguity that seu/sua would otherwise
        carry."
    explanation: "Grounded in the note's 'How Brazilians avoid ambiguity' section."
    source:
      note: "Grammar/Adjectives/Possessive Adjectives.md"
      heading: "5. How Brazilians avoid ambiguity"
