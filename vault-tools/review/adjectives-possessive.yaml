  - type: explain_difference
    topic: Adjectives
    subtopic: Seu is ambiguous — your/his/her/their
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain why \"Seu carro chegou.\" is ambiguous out of context."
    model_answers:
      - "Seu can mean your, his, her, or their, so 'Seu carro chegou.' could
        mean 'Your car arrived', 'His car arrived', 'Her car arrived', or 'Their
        car arrived' — without context there is no way to tell which one is
        meant."
    explanation: "Grounded in the note's '\"Seu\" can be confusing' section, which
      lists all four possible readings of the same sentence."
