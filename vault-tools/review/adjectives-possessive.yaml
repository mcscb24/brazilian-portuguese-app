  - type: explain_difference
    topic: Adjectives
    subtopic: Teu vs seu — regional variation
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain when a learner of general Brazilian Portuguese would hear
      teu/tua used instead of seu/sua."
    model_answers:
      - "Teu/tua goes with tu (the informal singular 'you'), while seu/sua
        traditionally goes with você. Since você is far more common than tu
        across most of Brazil, seu/sua is heard much more often overall — though
        tu (and teu/tua) is used regularly in some regions, such as much of Rio
        Grande do Sul and parts of the North and Northeast."
    explanation: "Grounded in the note's dedicated section 'A note on \"teu\" vs. \"seu\"'."
    source:
      note: "Grammar/Adjectives/Possessive Adjectives.md"
      heading: "13. A note on \"teu\" vs. \"seu\""
