  - type: explain_difference
    topic: Verbs
    subtopic: No direct Portuguese equivalent to English present perfect
    direction: null
    difficulty: medium
    register: neutral
    prompt: "English \"Have you eaten?\" uses the present perfect. Explain what
      Portuguese uses instead, and why."
    model_answers:
      - "Portuguese has no direct equivalent to the English present perfect
        (have + past participle). Instead it usually prefers the simple past —
        Você já comeu? (literally 'Did you already eat?') rather than a compound
        'have eaten' construction."
    explanation: "Grounded in the note's explicit statement: 'English Present
      Perfect has no direct equivalent in Portuguese' and the paired example
      Have you eaten? → Você já comeu?"
    source:
      note: "Grammar/Verbs/Tenses Overview.md"
      heading: "English Present Perfect"
    status: approved
    generation_version: 1
    id: verbs-tenses-overview-0005
    created_at: 2026-07-28
