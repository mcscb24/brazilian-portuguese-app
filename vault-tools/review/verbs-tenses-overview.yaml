    version: 1
    updated_at: 2026-07-28

  - type: explain_difference
    topic: Verbs
    subtopic: Tenho + participle means repeated/ongoing, not "have done"
    direction: null
    difficulty: hard
    register: neutral
    prompt: "Explain what \"Tenho estudado muito.\" actually means, and why it
      should NOT be translated as \"I have studied.\""
    model_answers:
      - "Tenho estudado muito means 'I've been studying a lot' — it implies a
        repeated or ongoing action that is recent and still continuing. It does
        not mean the single completed event 'I have studied' — that meaning is
        instead usually covered by the simple past in Portuguese."
    explanation: "Grounded in the note's ter + participle section: 'Tenho estudado
      muito. Meaning: I've been studying a lot. Not: I have studied.'"
    source:
      note: "Grammar/Verbs/Tenses Overview.md"
      heading: "When Portuguese Uses ter + participle"
