  - type: explain_difference
    topic: Verbs
    subtopic: Imperfeito vs tenho + participle — finished vs still continuing
    direction: null
    difficulty: hard
    register: neutral
    prompt: "Explain the difference between \"Eu estudava muito.\" and \"Tenho
      estudado muito.\" when both are translated as being about studying a lot."
    model_answers:
      - "Eu estudava muito (Imperfeito) describes a habit belonging entirely to
        a finished past period — you may not study that much anymore. Tenho
        estudado muito (tenho + participle) describes something recent that is
        still continuing — including today and probably tomorrow. The two tenses
        answer different questions: was it purely in the past, or is it still
        going on?"
    explanation: "Grounded in the note's Imperfeito vs Tenho + Particípio section
      and its worked Compare example (A: Eu estudava muito / B: Tenho estudado
      muito)."
    source:
      note: "Grammar/Verbs/Tenses Overview.md"
      heading: "Imperfeito vs Tenho + Particípio"
