  - type: explain_difference
    topic: Verbs
    subtopic: Vou falar vs falarei — spoken vs formal future
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain why Brazilians say \"vou falar\" far more often than
      \"falarei\", even though both mean roughly the same thing."
    model_answers:
      - "Vou falar (going to speak) is the natural, everyday way to express the
        future in spoken Brazilian Portuguese, while falarei is the formal
        simple future — grammatically correct but much less common in everyday
        speech, used mainly in writing or formal contexts."
    explanation: "Grounded in the note's Future section, which pairs 'vou falar'
      directly against 'falarei' as the spoken vs formal choice."
