  - type: explain_difference
    topic: Pronouns
    subtopic: Reflexive pronoun function — reciprocal "each other" use of se
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain how \"se\" can mean \"each other\" rather than \"himself/
      herself\", using \"Eles se conhecem\" and \"Nós nos encontramos ontem\" as
      examples."
    model_answers:
      - "The same reflexive-looking pronouns (se, nos) can mark a reciprocal
        action between two or more people, not just an action turned back on a
        single subject. Eles se conhecem means They know each other (not 'they
        know themselves'), and Nós nos encontramos ontem means We met each other
        yesterday. The pronoun forms are identical to the ordinary reflexive use
        — only the meaning changes, and context is what tells you which reading
        is intended."
    explanation: "Same pronouns, different function: reflexive se/nos turn the
      action back on the subject; reciprocal se/nos point the action between the
      people in the subject."
    source:
      note: "Grammar/Pronouns/Reflexive Pronouns.md"
      heading: "Step 11 – Reciprocal actions"
