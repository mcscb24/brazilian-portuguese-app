  - type: explain_difference
    topic: Pronouns
    subtopic: Reflexive pronoun placement — before vs after the verb
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain the difference in reflexive-pronoun placement between everyday
      spoken Brazilian Portuguese (\"Eu me levanto\") and the more formal,
      written style you might see in books or newspapers (\"Levantou-se\")."
    model_answers:
      - "In spoken Brazilian Portuguese, the reflexive pronoun almost always
        comes before the verb — Eu me levanto, Ela se chama, Nós nos
        encontramos. This is the natural, default word order to use when
        speaking. Formal written Portuguese sometimes places the pronoun
        attached after the verb instead — Levantou-se, Chamou-se — a style
        you'll encounter reading books or newspapers but wouldn't normally
        produce yourself in conversation."
    explanation: "Pronoun-before-verb is the safe default for speech; pronoun-
      after-verb is a formal/written variant to recognise when reading, not to
      imitate when speaking."
    source:
      note: "Grammar/Pronouns/Reflexive Pronouns.md"
      heading: "Step 10 – Position of the pronoun"
    status: approved
