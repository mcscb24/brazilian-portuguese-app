  - type: explain_difference
    topic: Pronouns
    subtopic: Reflexive pronoun function — você takes se, not te
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain why \"você\" takes the reflexive pronoun \"se\" rather than
      \"te\", even though \"te\" is extremely common with \"você\" for direct
      and indirect objects (e.g. \"Eu te amo\")."
    model_answers:
      - "Because você grammatically takes third-person verb forms, its reflexive
        pronoun has to match that same third-person pattern — se, not te. So
        Você se chama João and Você se levantou cedo are correct, even though
        Brazilians happily use te with você for direct/indirect objects (Eu te
        amo, Eu te disse). Reflexive constructions are one of the few places
        where Brazilian Portuguese is very consistent about matching se to
        você's grammatical person, regardless of how casual the register is."
    explanation: "This is the note's own 'one important correction': te stays common
      with você for direct/indirect objects, but reflexive se does not get
      replaced by te."
    source:
      note: "Grammar/Pronouns/Reflexive Pronouns.md"
      heading: "One important correction"
    status: approved
    generation_version: 1
