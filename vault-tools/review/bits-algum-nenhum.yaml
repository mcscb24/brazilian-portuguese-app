  - type: explain_difference
    topic: Bits and Bobs
    subtopic: Livro algum — emphatic word order exception
    direction: null
    difficulty: hard
    register: neutral
    prompt: "Explain the difference in style between \"Não encontrei nenhum livro.\"
      and \"Livro algum foi encontrado.\", even though both mean \"Not a single
      book was found.\""
    model_answers:
      - "Não encontrei nenhum livro is the normal, everyday way to say it, with
        nenhum before the noun. Livro algum foi encontrado places algum after
        the noun instead — an exception to the usual algum/nenhum-before-noun
        word order — which makes the sentence sound much more emphatic and
        literary. As a learner, nenhum livro is the form to use in everyday
        speech."
    explanation: "Grounded in the note's section on \"Livro algum\" as a more
      emphatic style, contrasted directly with the normal-conversation nenhum
      livro example."
    source:
