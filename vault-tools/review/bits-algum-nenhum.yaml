  - type: explain_difference
    topic: Bits and Bobs
    subtopic: Algum vs qualquer
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain the difference in meaning between algum and qualquer, using
      \"Você conhece algum médico?\" and \"Qualquer médico pode fazer isso\" as
      examples."
    model_answers:
      - "Algum means \"some/any\" in the sense that at least one exists — Você
        conhece algum médico? asks whether the person knows of any doctor at
        all. Qualquer means \"any at all/whichever\" and signals that it doesn't
        matter which one — Qualquer médico pode fazer isso says any doctor, no
        matter which, could do it. Algum is about existence of at least one;
        qualquer is about indifference to which one."
    explanation: "Algum questions whether at least one instance exists; qualquer
      expresses indifference to which particular instance is chosen."
    source:
      note: "Bits and Bobs/Algum & Nenhum.md"
      heading: "10. Algum vs Qualquer"
