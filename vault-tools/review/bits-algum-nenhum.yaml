questions:
  - type: explain_difference
    topic: Bits and Bobs
    subtopic: Algum vs nenhum — positive vs negative
    direction: null
    difficulty: easy
    register: neutral
    prompt: "Explain when to use algum versus nenhum, and why \"Não tenho nenhum
      dinheiro\" is grammatically correct even though it looks like a double
      negative in English."
    model_answers:
      - "Algum (\"some/any\") is used in positive statements and most questions,
        e.g. Tenho alguns amigos, Você tem algum irmão? Nenhum (\"none/not
        any\") is used in negative sentences alongside não, e.g. Não tenho
        nenhum dinheiro. Portuguese requires this negative concord — both the
        verb and the following word are negative — so the literal \"I don't have
        no money\" reading is standard, correct Portuguese, unlike in English
        where a second negative would cancel the first."
    useful_structures:
      - "algum(a) in positive statements and questions"
      - "não + verb + nenhum(a) (negative concord)"
    explanation: "Algum marks existence in positive/question contexts; nenhum marks
      absence and pairs with não as normal negative concord in Portuguese, not a
      double negative like in English."
    source:
      note: "Bits and Bobs/Algum & Nenhum.md"
      heading: "6. Algum vs Nenhum"
