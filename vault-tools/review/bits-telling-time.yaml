  - type: explain_difference
    topic: Bits and Bobs
    subtopic: Ao meio-dia vs à meia-noite — gender of noon/midnight
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain why \"at noon\" is \"ao meio-dia\" but \"at midnight\" is \"à
      meia-noite\"."
    model_answers:
      - "meio-dia (noon) is masculine, so it takes the masculine contraction ao
        (a + o). meia-noite (midnight) is feminine, so it takes the feminine
        contraction à (a + a). The gender of each word determines which
        contraction is used."
    explanation: "Grounded in the note's 'At noon and midnight' section: 'meio-dia
      is masculine → ao meio-dia. meia-noite is feminine → à meia-noite.'"
    source:
      note: "Bits and Bobs/Telling the Time.md"
      heading: "At noon and midnight"
