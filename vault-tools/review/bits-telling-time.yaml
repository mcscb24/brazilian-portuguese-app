  - type: explain_difference
    topic: Bits and Bobs
    subtopic: É vs São for telling the hour
    direction: null
    difficulty: easy
    register: neutral
    prompt: "Explain when to use É and when to use São when saying what time it is."
    model_answers:
      - "É is used only with one o'clock (É uma hora), while São is used for two
        o'clock or more (São duas horas, São cinco horas). This is because ser
        agrees with the number of hours: one hour is singular, two or more hours
        are plural."
    explanation: "Grounded in the note's 'Important: É vs São' subsection."
