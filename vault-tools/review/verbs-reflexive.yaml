  - type: explain_difference
    topic: Verbs
    subtopic: Reflexive verb meaning — levantar vs levantar-se
    direction: null
    difficulty: easy
    register: neutral
    prompt: "Explain the difference in meaning between \"levantar\" and
      \"levantar-se\"."
    model_answers:
      - "levantar (non-reflexive) means to lift or raise something/someone else
        — it takes an external object. levantar-se (reflexive, marked by -se)
        means to get (oneself) up, e.g. out of bed — the subject performs the
        action on themselves rather than on something else. The same pattern
        shows up across many other reflexive verbs: the plain verb acts on an
        external object, the -se version turns the action back on the subject."
    explanation: "The -se ending is what signals the action is reflexive
      (self-directed) rather than acting on an outside object."
    source:
      note: "Grammar/Verbs/Reflexive Verbs Cheat Sheet.md"
      heading: "The Infinitive Form"
