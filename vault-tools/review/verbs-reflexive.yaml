  - type: explain_difference
    topic: Verbs
    subtopic: Reflexive verbs that don't translate as literally reflexive in English
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain why \"Eu me lembro\" means \"I remember\" rather than a literal
      \"I remember myself\", and why this matters when translating into
      Portuguese."
    model_answers:
      - "Portuguese often uses a reflexive verb where English uses a plain,
        non-reflexive one. Eu me lembro literally reads as I remember myself,
        but the real English equivalent is simply I remember — English just
        doesn't mark this verb as reflexive at all. Same with Ela se chama Ana:
        literally She calls herself Ana, but it really means Her name is Ana.
        This matters because you can't rely on the English sentence to tell you
        whether the Portuguese verb needs -se — you have to learn which verbs
        are reflexive in Portuguese as a property of the verb itself,
        independent of whether English happens to use 'myself'."
    explanation: "lembrar-se and chamar-se are both grammatically reflexive in
      Portuguese despite having ordinary, non-reflexive English translations — a
      common source of confusion for learners translating word-for-word."
    source:
      note: "Grammar/Verbs/Reflexive Verbs Cheat Sheet.md"
      heading: "Important: Not Always Reflexive in English"
    status: approved
