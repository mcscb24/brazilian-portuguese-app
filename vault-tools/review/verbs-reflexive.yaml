      \"No Brasil se fala português.\""
    model_answers:
      - "(a) Passive se — Aluga-se apartamento means Apartment for rent /
        apartment is rented; the subject (apartamento) is the thing being acted
        on, not a person. (b) Reflexive se — Ele se veste rápido means He gets
        dressed quickly; the subject (ele) is a person acting on himself. (c)
        Impersonal se — No Brasil se fala português means Portuguese is spoken
        in Brazil / people speak Portuguese in Brazil; it's a general statement
        about people, with no specific person as subject."
    explanation: "The three examples are the note's own worked cases for each type,
