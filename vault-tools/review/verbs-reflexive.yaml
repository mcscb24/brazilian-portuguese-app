questions:
  - type: explain_difference
    topic: Verbs
    subtopic: Three types of se — reflexive vs passive vs impersonal
    direction: null
    difficulty: hard
    register: neutral
    prompt: "Explain the difference between the three uses of \"se\" in Brazilian
      Portuguese — reflexive, passive, and impersonal — using \"Ela se
      levantou\", \"Vendem-se casas\", and \"Aqui se trabalha muito\" as
      examples."
    model_answers:
      - "Reflexive se: the subject performs the action on itself — Ela se
        levantou means She got up (she got herself up); the subject is a person
        acting on themselves. Passive se: something is done — Vendem-se casas
        means Houses are sold; here the subject is the thing being acted on, not
        a person doing the acting. Impersonal se: a general statement about
        people — Aqui se trabalha muito means People work a lot here; the
        sentence describes what people in general do, with no specific person as
        subject. To tell them apart, ask: is a person acting on themselves
        (reflexive), is a thing being acted upon (passive), or is this a general
        statement about people (impersonal)?"
    explanation: "The note's own recognition test: person-acting-on-self =
      reflexive; thing-being-acted-on = passive; general-statement-about-people
      = impersonal."
    source:
      note: "Grammar/Verbs/Reflexive Verbs Cheat Sheet.md"
      heading: "The 3 Types of se in Brazilian Portuguese"
