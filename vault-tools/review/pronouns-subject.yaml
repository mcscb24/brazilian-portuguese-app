  - type: explain_difference
    topic: Pronouns
    subtopic: Subject pronoun dropping — why eu/nós drop but você/ele/ela stay
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain why \"eu\" and \"nós\" are often dropped in Brazilian
      Portuguese, while \"você\", \"ele\", and \"ela\" are usually kept
      explicit."
    model_answers:
      - "Portuguese verb endings usually make eu and nós subjects unambiguous on
        their own — Eu falo and Falo are equally clear that 'I' is the subject,
        and the same goes for Nós estamos cansados vs Estamos cansados — so
        those pronouns can be safely dropped without losing information. But
        você, ele, and ela all share the exact same verb form (fala), so without
        the pronoun, a bare Fala is genuinely ambiguous between he/she/you.
        Brazilians therefore keep você, ele, and ela explicit specifically to
        disambiguate who's being talked about, even though grammatically the
        verb ending alone wouldn't require it."
    explanation: "Pronoun-dropping tracks how much information the verb ending alone
      gives you: unambiguous endings (eu, nós) get dropped; shared, ambiguous
      endings (você/ele/ela) keep the pronoun."
    source:
      note: "Grammar/Pronouns/Subject Pronouns.md"
      heading: "Portuguese often drops pronouns"
    status: approved
    generation_version: 1
    id: pronouns-subject-0003
    created_at: 2026-07-24
    content_hash: sha256:c42c98ce81f7e4b672fb42fa1039a30d70ff00b1d48f75317d4c6a724ef5b858
    version: 1
    updated_at: 2026-07-24

  - type: explain_difference
    topic: Pronouns
    subtopic: Subject pronouns — você's third-person grammar
    direction: null
    difficulty: easy
    register: neutral
    prompt: "Explain why \"você\" is grammatically treated like \"ele\" and \"ela\"
      rather than like a true second-person pronoun, even though it means
      \"you\"."
    model_answers:
      - "Você historically comes from Vossa Mercê, a polite third-person form of
        address, and modern Brazilian Portuguese has kept that third-person
        grammar even as você became the everyday word for 'you'. So você takes
        the exact same verb conjugation as ele/ela — Você fala, Ele fala, Ela
        fala — never a true second-person form like the incorrect Você falas.
        The same logic extends to the plural: vocês takes the same verb form as
        eles/elas."
    explanation: "você looks like 'you' but conjugates like 'he/she' — a direct
      consequence of its origin as a third-person title rather than a true
      second-person pronoun."
    source:
      note: "Grammar/Pronouns/Subject Pronouns.md"
      heading: "Você"
    status: approved
    generation_version: 1
