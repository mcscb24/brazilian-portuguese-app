questions:
  - type: explain_difference
    topic: Bits and Bobs
    subtopic: Que vs do que after comparatives
    direction: null
    difficulty: easy
    register: neutral
    prompt: "Explain the difference, if any, between que and do que when used after
      a comparative like mais or menos."
    model_answers:
      - "There is no real difference in meaning — both que and do que translate
        \"than\" after a comparative, and either can be used: Ele é mais alto
        que eu and Ele é mais alto do que eu both mean \"He is taller than me.\"
        Do que is common in both speech and writing; que on its own is a
        slightly shorter, equally natural alternative."
    explanation: "Both forms are grammatically correct and interchangeable in
      Brazilian Portuguese; the choice between them is stylistic, not a matter
      of meaning."
    source:
      note: "Bits and Bobs/Making Comparisons.md"
      heading: "7. Que vs Do que"
    status: approved
    generation_version: 1
