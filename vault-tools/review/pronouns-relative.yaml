  - type: explain_difference
    topic: Pronouns
    subtopic: Cujo is formal and rare in speech
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain why cujo (whose) is a relative pronoun best recognised for
      reading rather than used often in everyday spoken Brazilian Portuguese."
    model_answers:
      - "Cujo (and its forms cuja/cujos/cujas) means 'whose' and agrees with the
        noun that follows it, but it belongs mainly to formal or written
        Portuguese. In everyday speech Brazilians tend to rephrase around it
        rather than use it directly, so learners mainly need to recognise it
        when reading rather than produce it fluently in conversation."
    explanation: "Grounded in the note's section on cujo."
    source:
      note: "Grammar/Pronouns/Relative Pronouns.md"
      heading: "6. Cujo (whose)"
    status: approved
