  - type: explain_difference
    topic: Adjectives
    subtopic: Todo livro vs todos os livros
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain the difference in meaning between \"Todo livro conta uma
      história.\" and \"Todos os livros contam uma história.\""
    model_answers:
      - "Todo livro (singular, no article) means 'every book' — each one
        individually. Todos os livros (plural, with the article os) means 'all
        the books' — the whole group together. Both use todo/todos but express a
        subtly different scope."
    explanation: "Grounded in the note's distinction: 'Todo livro = every book.
      Todos os livros = all the books.'"
    source:
