questions:
  - type: explain_difference
    topic: Pronouns
    subtopic: Direct object vs indirect object
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain the difference between a direct object and an indirect object,
      using \"Eu vi o livro.\" and \"Eu dei o livro para ele.\" as examples."
    model_answers:
      - "The direct object receives the action directly with no preposition — o
        livro in 'Eu vi o livro' (I saw the book) is what was seen. The indirect
        object is the person who benefits from or receives the action, usually
        introduced by a preposition like para/a — ele in 'Eu dei o livro para
        ele' (I gave the book to him) is who received it, not what was given."
    explanation: "Grounded in Step 1 of the note, contrasting 'Direct object' and
      'Indirect object'."
    source:
      note: "Grammar/Pronouns/Indirect Object Pronouns.md"
      heading: "Step 1 – What's an indirect object?"
