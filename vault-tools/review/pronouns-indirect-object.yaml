  - type: explain_difference
    topic: Pronouns
    subtopic: Lhe replaced by para + pronoun in spoken Brazilian Portuguese
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Formal grammar uses lhe for 'to him/her/you'. Explain what Brazilians
      actually say instead in everyday spoken Portuguese."
    model_answers:
      - "In everyday spoken Brazilian Portuguese, lhe is largely avoided.
        Instead of 'Eu lhe dei o livro', people say 'Eu dei o livro para
        ele/para ela/para você' — using para + the appropriate pronoun makes it
        clearer exactly who is meant, whereas lhe alone is ambiguous between
        him, her, and you."
    explanation: "Grounded in Step 3 – The modern Brazilian reality and Step 7 –
      \"Lhe\" vs \"para ele\"."
    source:
      note: "Grammar/Pronouns/Indirect Object Pronouns.md"
      heading: "Step 3 – The modern Brazilian reality"
    status: approved
    generation_version: 1
    id: pronouns-indirect-object-0004
    created_at: 2026-07-28
