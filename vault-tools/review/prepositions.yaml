    prompt: "Explain why English speakers often get confused using a single
      Portuguese word for \"in\", \"on\", and \"at\"."
    model_answers:
      - "English uses three different words (in/on/at) depending on the kind of
        location, but Portuguese usually collapses all three into one word, em —
