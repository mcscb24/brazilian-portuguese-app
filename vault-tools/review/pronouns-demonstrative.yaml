  - type: explain_difference
    topic: Pronouns
    subtopic: Neuter demonstrative pronouns have no gender
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain why isto, isso, and aquilo have no gender, unlike este, esse,
      and aquele."
    model_answers:
      - "Este/esse/aquele (and their feminine/plural forms) agree with a
        specific noun they replace or describe, so they carry gender and number.
        Isto/isso/aquilo are neuter — they don't refer to any specific noun at
        all, only to situations, ideas, facts, or actions, so there is nothing
        for them to agree with."
    explanation: "Grounded in Step 7: neuter pronouns 'have no gender because they
      don't refer to a specific noun. Instead they refer to: situations, ideas,
      facts, actions.'"
    source:
      note: "Grammar/Pronouns/Demonstrative Pronouns.md"
      heading: "Step 7 – The neutral pronouns"
    status: approved
    generation_version: 1
    id: pronouns-demonstrative-0003
    created_at: 2026-07-28
    content_hash: sha256:ed4390e174de3e143156966e5142b4cdee57cdf3faf0026a922a6d7cf738422e
    version: 1
    updated_at: 2026-07-28

