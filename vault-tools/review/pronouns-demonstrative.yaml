  - type: explain_difference
    topic: Pronouns
    subtopic: Isso vs isto in modern spoken Brazilian Portuguese
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Traditional grammar assigns isto to 'this' and isso to 'that'. Explain
      why isso is nonetheless far more common than isto in modern spoken
      Brazilian Portuguese."
    model_answers:
      - "Even though isto is technically 'this' (near me) and isso is 'that'
        (near you / already mentioned), everyday Brazilian speech has largely
        shifted to using isso for both — e.g. 'O que é isso?' is much more
        common than 'O que é isto?', and 'É isso.' is a fixed everyday
        expression. Isto survives mainly in formal writing."
    explanation: "Grounded in the note's dedicated section 'A note on isto, isso,
      and aquilo'."
    source:
      note: "Grammar/Pronouns/Demonstrative Pronouns.md"
      heading: "A note on isto, isso, and aquilo"
