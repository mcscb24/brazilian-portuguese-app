  - type: explain_difference
    topic: Articles
    subtopic: Professions — article dropped after ser, kept with a description
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain why \"Ela é médica.\" has no article, while \"Ela é uma
      excelente médica.\" does."
    model_answers:
      - "After ser, professions normally take no article when simply stating
        what someone is (Ela é médica = She is a doctor). Once the profession is
        described with an adjective (uma excelente médica = an excellent
        doctor), the indefinite article reappears because you're now
        characterizing her, not just naming her job."
    explanation: "Grounded in the note's Professions section: 'the article is used
      because you're describing her as an excellent doctor, not just stating her
      profession.'"
    source:
      note: "Grammar/Articles.md"
      heading: "7. Professions"
    status: approved
    generation_version: 1
    id: articles-0005
    created_at: 2026-07-28
    content_hash: sha256:5b43a7d9773fb41be3a825017932380e8052b9a42769834989283a593a87b801
    version: 1
    updated_at: 2026-07-28

  - type: context_choice
    topic: Articles
    subtopic: Definite vs indefinite — first mention vs already known
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Choose the correct article: \"Vi um cachorro. ___ cachorro era
      grande.\" (I saw a dog. The dog was big.)"
    accepted_answers:
      - text: "O"
        accent_sensitive: true
    explanation: "The dog is introduced with the indefinite article um (first
      mention), then referred back to with the definite article O, because now
      everyone knows which dog is meant."
