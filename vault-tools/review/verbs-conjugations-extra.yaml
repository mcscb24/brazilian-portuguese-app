  - type: explain_difference
    topic: Verbs
    subtopic: Near Future vs Spoken Conditional — same formula, different tense of ir
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain how \"vou comer\" (Near Future) and \"ia comer\" (Spoken
      Conditional) are built from the same underlying formula, and what actually
      changes between them."
    model_answers:
      - "Both use the pattern ir + infinitive, and the infinitive (comer) never
        changes. What changes is the tense of ir itself: Near Future uses the
        present tense of ir (vou, vai, vamos, vão) to mean 'going to do
        something', while Spoken Conditional uses the imperfect tense of ir (ia,
        ia, íamos, iam) to mean 'was going to do something'. The same simple
        construction shifts from a future meaning to a past-future meaning just
        by changing which tense of ir is used."
    explanation: "Grounded in the note's two side-by-side formulas: ir (present) +
      infinitive for Near Future, and ir (imperfect) + infinitive for Spoken
      Conditional."
    source:
      note: "Grammar/Verbs/Conjugations.md"
      heading: "Spoken Conditional"
    status: approved
    generation_version: 1
    id: verbs-conjugations-extra-0005
    created_at: 2026-07-28
    content_hash: sha256:7f9691e9ff1ddc798d100549e6c0383fdbf80975c52782c138fbb63d9813056a
    version: 1
    updated_at: 2026-07-28

