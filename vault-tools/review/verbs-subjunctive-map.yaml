  - type: explain_difference
    topic: Verbs
    subtopic: Two future events — the real trigger for the future subjunctive
    direction: null
    difficulty: hard
    register: neutral
    prompt: "Explain why \"Vou para o Brasil.\" is indicative but \"Quando eu for
      para o Brasil, vou visitar minha família.\" is future subjunctive, even
      though both sentences are about the future."
    model_answers:
      - "Vou para o Brasil is a single, simple statement about the future — no
        condition, so it stays indicative. Quando eu for para o Brasil, vou
        visitar minha família contains two future events: going to Brazil hasn't
        happened yet, and it sets the timing for the second event (visiting
        family). Whenever one not-yet-happened event acts as the condition or
        trigger for another, that first verb takes the future subjunctive (for)
        — the real test isn't \"is this about the future?\" but \"does this
        future event trigger another one?\""
    explanation: "The note's core distinction: plain future statements stay
      indicative; only a future event that conditions or triggers a second
      future event takes the future subjunctive."
    source:
      note: "Grammar/Verbs/Subjunctive Map.md"
      heading: "Extra Point on Future Subjunctive"
    status: approved
    generation_version: 1
    id: verbs-subjunctive-map-0007
