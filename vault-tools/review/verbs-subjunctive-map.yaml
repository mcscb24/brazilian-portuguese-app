  - type: explain_difference
    topic: Verbs
    subtopic: Future subjunctive after quando — event not yet happened
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Why is the future subjunctive used in \"Quando você chegar, me liga.\"?"
    model_answers:
      - "Quando (when) introduces a future event — the arriving — that hasn't
        happened yet at the moment of speaking. Because that event is still
        unrealised and acts as the condition for the second action (calling),
        chegar takes the future subjunctive rather than the indicative."
    explanation: "The mental shortcut for this subjunctive is \"has this future
      event happened yet?\" — no, so it takes the future subjunctive form
      chegar, not the indicative chega."
    source:
      note: "Grammar/Verbs/Subjunctive Map.md"
      heading: "2. Future Subjunctive"
