# Review file for questions sourced from "Grammar/Verbs/Subjunctive Map.md".
#
# Workflow reminder: see bits-tao-tanto.yaml for the full explanation of
# status / id / content_hash / version handling. Short version: leave id
# blank, set status: approved, publish.js does the rest and writes ids back.
#
# This note's own goal is recognising *when* to use each of the three
# subjunctives (present / future / imperfect) rather than drilling their
# conjugations — verbs-subjunctive.yaml and the verb_conjugation generator
# already cover conjugation drilling for the subjunctive mood. So this batch
# is almost entirely self-assessed comparison/recognition content
# (explain_difference, open_completion, speak_aloud), plus a handful of
# choose_form "classify this sentence" questions with a short exact answer
# (present / future / imperfect).

questions:
  - type: explain_difference
    topic: Verbs
    subtopic: Present vs future subjunctive — attitude vs unrealised event
    direction: null
    difficulty: hard
    register: neutral
    prompt: "Explain the difference between \"Espero que ele venha.\" and \"Se ele
      vier...\""
    model_answers:
      - "Espero que ele venha uses the present subjunctive because the speaker
        is expressing an attitude — hope — toward the event, not stating a fact.
        Se ele vier... uses the future subjunctive because it frames the coming
        as a future event that hasn't happened yet, usually as the condition for
        something else. Both are \"not a fact\", but the present subjunctive is
        about how the speaker feels, while the future subjunctive is
        specifically about an event's position in an unrealised future."
    explanation: "Present subjunctive answers \"how does the speaker feel about
      this?\"; future subjunctive answers \"has this future event happened
      yet?\" — two different questions that happen to both avoid the
      indicative."
    source:
      note: "Grammar/Verbs/Subjunctive Map.md"
      heading: "Compare All Three"
    status: approved
    generation_version: 1
    id: verbs-subjunctive-map-0001
    created_at: 2026-08-06
    content_hash: sha256:84496cdcc174e3c53836b9b2513e6121c7ee6d0c73b7c401fc77fcd0d1e24b18
    version: 1
    updated_at: 2026-08-06

  - type: explain_difference
    topic: Verbs
    subtopic: Future vs imperfect subjunctive — possible vs unreal condition
    direction: null
    difficulty: hard
    register: neutral
    prompt: "Explain the difference between \"Se eu tiver tempo...\" and \"Se eu
      tivesse tempo...\""
    model_answers:
      - "Se eu tiver tempo... uses the future subjunctive: having time is still
        possible, nobody knows yet whether it will happen. Se eu tivesse
        tempo... uses the imperfect subjunctive: the speaker is imagining
        another reality, one where they currently don't have time — it's
        hypothetical or contrary to fact, not just unresolved."
    explanation: "tiver (future subjunctive) leaves the outcome open and possible;
      tivesse (imperfect subjunctive) signals the speaker is imagining a reality
      that isn't the current one."
    source:
