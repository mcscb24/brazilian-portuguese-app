questions:
  - type: explain_difference
    topic: Verbs
    subtopic: Present subjunctive vs future subjunctive
    direction: null
    difficulty: hard
    register: neutral
    prompt: "Explain the difference between the present subjunctive and the future
      subjunctive, using \"Espero que ele venha\" and \"Se ele vier...\" as
      examples."
    model_answers:
      - "The present subjunctive expresses a wish, hope, doubt or emotion about
        something, e.g. Espero que ele venha (I hope he comes) — the coming
        isn't presented as fact. The future subjunctive specifically marks a
        future event that hasn't happened yet, typically after triggers like se,
        quando or assim que, e.g. Se ele vier... (If he comes...). Both are
        \"not a fact\", but the future subjunctive additionally commits to the
        event being time-located in an as-yet-unrealised future, which is why it
        changes the verb form again rather than reusing the present
        subjunctive."
    useful_structures:
      - "espero que + present subjunctive"
      - "se/quando/assim que + future subjunctive"
    explanation: "Present subjunctive covers wishes/doubts/emotions in general;
      future subjunctive is reserved for events explicitly framed as
      not-yet-happened, cued by triggers like se, quando, assim que."
    source:
      note: "Grammar/Verbs/Subjunctive.md"
      heading: "Present vs Future Subjunctive"
    status: approved
    generation_version: 1
    id: verbs-subjunctive-0001
    created_at: 2026-07-24
    content_hash: sha256:5a9589d35f52f08345a3df390f62f13e0a0c2ab8a9974d1f873289c6efa0c506
    version: 1
    updated_at: 2026-07-24

  - type: explain_difference
    topic: Verbs
    subtopic: Subjunctive vs infinitive after a change of subject
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain why \"Eu quero comer\" uses the infinitive but \"Eu quero que
      você venha\" switches to the subjunctive."
    model_answers:
      - "When the same person performs both actions, Portuguese uses the
        infinitive — Eu quero comer (I want to eat: I do both the wanting and
        the eating). When a different subject is involved in the second action,
        Portuguese switches to the subjunctive introduced by que — Eu quero que
        você venha (I want you to come: I want, but you come). The change of
        subject between the two clauses is what triggers the subjunctive; same
        subject keeps the simpler infinitive."
    explanation: "Same-subject sentences stay in the infinitive; as soon as a
      second, different subject appears in the que-clause, the verb must switch
      to the subjunctive."
    source:
      note: "Grammar/Verbs/Subjunctive.md"
      heading: "Step 3 – Different Subject?"
    status: approved
    generation_version: 1
    id: verbs-subjunctive-0002
    created_at: 2026-07-24
    content_hash: sha256:d7677017cf1aef3cfe5d7e7703e71984894765877831a80ae9ae0175b9d4f3f9
    version: 1
    updated_at: 2026-07-24

