  - type: explain_difference
    topic: Verbs
    subtopic: The two-doors mental picture for the future subjunctive
    direction: null
    difficulty: hard
    register: neutral
    prompt: "Explain the \"two doors\" way of deciding between the indicative and
      the future subjunctive, and how the question \"Has the event happened?\"
      fits into it."
    model_answers:
      - "Imagine two doors: Door A is something you already know what's behind —
        that's the indicative, used for facts. Door B hasn't been opened yet —
        that's the future subjunctive, used for an event that hasn't happened
        yet. The test is simply to ask: Has the event happened? If yes, use the
        indicative. If no, use the future subjunctive. The future subjunctive
        isn't really about future time in general — it's specifically about an
        unfinished, not-yet-real event."
    explanation: "Grounded in the note's Secret of the Future Subjunctive section
      and its two-doors mental picture."
    source:
      note: "Grammar/Verbs/Subjunctive.md"
      heading: "The Secret of the Future Subjunctive"
    status: approved
    generation_version: 1
    id: verbs-subjunctive-0009
    created_at: 2026-07-28
    content_hash: sha256:4dc68555680d7fce0bf92a7ed766e90ebc21a49bf58ac3ab4c5dc755e6dd7050
    version: 1
    updated_at: 2026-07-28

