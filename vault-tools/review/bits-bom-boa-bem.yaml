questions:
  - type: explain_difference
    topic: Bits and Bobs
    subtopic: Bom/boa vs bem — adjective vs adverb
    direction: null
    difficulty: easy
    register: neutral
    prompt: "Explain the difference between bom/boa and bem, and explain why
      Brazilians say \"Que bom!\" but never \"Que bem!\" when reacting to good
      news."
    model_answers:
      - "Bom and boa are adjectives and must agree with the noun they describe —
        bom for masculine (um bom livro), boa for feminine (uma boa ideia). Bem
        is an adverb that never changes form and describes how an action is done
        or a state, e.g. Ele fala bem, Estou bem. \"Que bom!\" reacts to a thing
        or situation, which is noun-like, so it takes the adjective bom rather
        than the adverb bem — \"Que bem!\" would be describing an action that
        isn't there."
    useful_structures:
      - "bom/boa + noun (adjective agreement)"
      - "verb + bem (adverb describing an action or state)"
      - "Tudo bem? / Que bom!"
    explanation: "Bom/boa describe nouns and agree in gender; bem describes
      verbs/states and is invariant. Que bom! comments on a situation
      (noun-like), so it needs the adjective, not the adverb."
    source:
      note: "Bits and Bobs/Bom, Boa & Bem.md"
      heading: "Step 4 – The easiest test"
