  - type: explain_difference
    topic: Bits and Bobs
    subtopic: Muito bom vs muito bem
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain the difference between \"muito bom\" and \"muito bem\", with an
      example of each."
    model_answers:
      - "Muito bom (\"very good\") describes a thing or person, e.g. Esse filme
        é muito bom — the film, a noun, is very good. Muito bem (\"very well\")
        describes how an action is performed, e.g. Você fala português muito bem
        — describing the speaking, a verb. It's the same noun-vs-action rule as
        bom/bem, just intensified with muito."
    useful_structures:
      - "muito bom + noun/thing"
      - "muito bem + verb/action"
    explanation: "Muito intensifies whichever word the sentence already needs — bom
      for a thing, bem for an action — so the choice still follows the ordinary
      bom/bem rule."
    source:
      note: "Bits and Bobs/Bom, Boa & Bem.md"
      heading: "Step 9 – Muito bom vs Muito bem"
