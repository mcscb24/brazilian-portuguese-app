  - type: explain_difference
    topic: Verbs
    subtopic: Familiar vs formal imperative
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain the difference between the familiar imperative \"Fala a
      verdade!\" and the formal imperative \"Abra aqui.\", including when each
      is used."
    model_answers:
      - "The familiar imperative (Fala a verdade!) is built from the present
        indicative você form and is used in everyday spoken Brazilian
        Portuguese, even with friends. The formal imperative (Abra aqui.) is
        built from the present subjunctive instead, and is used with o senhor, a
        senhora, in formal speech, or in written instructions. Same command
        function, but a different underlying verb form depending on how formal
        the situation is."
    explanation: "Grounded in the note's Formal Imperative section, which contrasts
      the present-subjunctive-based formal form against the indicative-based
      familiar imperative introduced earlier."
