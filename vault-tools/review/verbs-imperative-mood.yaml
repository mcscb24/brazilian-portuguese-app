  - type: explain_difference
    topic: Verbs
    subtopic: Indicative vs subjunctive vs imperative — same verb, three moods
    direction: null
    difficulty: hard
    register: neutral
    prompt: "Using the verb fechar (to close), explain what changes between \"Você
      fecha a porta.\", \"Espero que você feche a porta.\", and \"Fecha a
      porta!\""
    model_answers:
      - "All three use the same verb, fechar, but in a different mood. Você
        fecha a porta is indicative — a plain statement of fact (You close the
        door). Espero que você feche a porta is subjunctive — expressing a hope,
        not a fact (I hope you close the door). Fecha a porta! is imperative — a
        direct command (Close the door!). The mood, not the tense, is what
        changes the verb's job in the sentence."
    explanation: "Grounded in the note's Key Mental Model table, which lines up
      Indicative/Subjunctive/Imperative against the same verb fechar to show how
      mood — not tense — is what's different."
    source:
      note: "Grammar/Verbs/Imperative Mood.md"
      heading: "9️⃣ The Key Mental Model"
    status: approved
    generation_version: 1
    id: verbs-imperative-mood-0004
    created_at: 2026-07-28
    content_hash: sha256:37fcd422de351eb5943ead74f6e8d5486dc97a19a2a4bbeff5964b723ec0cd99
    version: 1
    updated_at: 2026-07-28

