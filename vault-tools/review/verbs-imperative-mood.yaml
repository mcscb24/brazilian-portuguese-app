  - type: explain_difference
    topic: Verbs
    subtopic: Affirmative vs negative imperative
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain why \"Fala comigo\" is correct for an affirmative command but
      \"Não fale assim\" (not \"Não fala assim\") is correct for a negative
      one."
    model_answers:
      - "Affirmative familiar commands in spoken Brazilian Portuguese reuse the
        você present-indicative form, e.g. Fala comigo (from você fala).
        Negative commands always switch to the present subjunctive instead, e.g.
        Não fale assim, never Não fala assim. So the same person is being
        addressed, but affirmative and negative commands are built from two
        different underlying verb forms."
    explanation: "Brazilian Portuguese's familiar imperative borrows the indicative
      for affirmative commands but always requires the subjunctive as soon as
      the command is negated."
    source:
      note: "Grammar/Verbs/Imperative Mood.md"
      heading: "6️⃣ Negative Imperative"
