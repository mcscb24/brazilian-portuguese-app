  - type: explain_difference
    topic: Bits and Bobs
    subtopic: Dar para — possibility, permission, and sufficiency
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain the different meanings dar para can have, using \"Não dá para
      ir hoje.\", \"Dá para usar seu telefone?\", and \"Esse dinheiro dá para
      comprar um carro?\" as examples."
    model_answers:
      - "Dar para is very versatile: 'Não dá para ir hoje' means it's not
        possible to go today (possibility); 'Dá para usar seu telefone?' means
        'Can I use your phone?' (asking permission); and 'Esse dinheiro dá para
        comprar um carro?' asks whether the money is enough to buy a car
        (sufficiency). The same structure covers possibility, permission, and
        'is it enough'."
    explanation: "Grounded in the note's three numbered meanings under Dar para: Is
      it possible?, Can I?, and Enough."
    source:
      note: "Bits and Bobs/Common Structures.md"
      heading: "4. Dar para = Possible / Enough / Suitable"
    status: approved
