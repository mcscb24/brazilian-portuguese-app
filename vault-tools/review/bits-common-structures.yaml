  - type: explain_difference
    topic: Bits and Bobs
    subtopic: Já — already vs right now
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain the two different meanings of já in \"Já comi.\" and \"Já vou.\""
    model_answers:
      - "In 'Já comi' (I've already eaten), já marks something already completed
        — 'already'. In 'Já vou' (I'm coming now), já instead marks immediacy —
        'now/right away' — a very common way to say you're coming immediately,
        not that you've already gone."
    explanation: "Grounded in the note's separate 'Already' and 'Now / immediately'
