  - type: explain_difference
    topic: Bits and Bobs
    subtopic: Ser vs ficar — permanent trait vs change of state
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain the difference between \"Ele é inteligente.\" and \"Ele ficou
      inteligente.\""
    model_answers:
      - "Ser (é) describes a permanent characteristic — he is intelligent, as a
        lasting trait. Ficar (ficou) describes a change of state — he became
        intelligent, entering a new condition he wasn't necessarily in before.
        Ficar captures the idea of entering a state and remaining there, unlike
        ser's permanence."
    explanation: "Grounded in the note's Compare section contrasting Ser (permanent
      characteristic) with Ficar (change of state)."
