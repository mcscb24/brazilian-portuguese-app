  - type: explain_difference
    topic: Bits and Bobs
    subtopic: Né? as a softening tag question
    direction: null
    difficulty: easy
    register: spoken
    prompt: "Explain what né? does in a sentence like \"Está quente hoje, né?\", and
      where the word comes from."
    model_answers:
      - "Né? comes from não é? (isn't it?) and is added to the end of a sentence
        as a tag question, similar to English 'isn't it?' or 'right?'. In 'Está
        quente hoje, né?' (It's hot today, isn't it?), it softens the statement
        and invites agreement, making the conversation feel more natural."
    explanation: "Grounded in the note's Né? section: 'It comes from não é? ... It
      makes conversation softer.'"
    source:
      note: "Bits and Bobs/Common Structures.md"
      heading: "11. Né?"
    status: approved
