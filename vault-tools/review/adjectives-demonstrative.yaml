  - type: explain_difference
    topic: Adjectives
    subtopic: Esse replacing este in everyday Brazilian speech
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain why a Brazilian might say \"Esse carro é bonito.\" instead of
      the formally-taught \"Este carro é bonito.\", even when holding the car
      keys themselves."
    model_answers:
      - "In everyday Brazilian Portuguese, esse/essa has largely taken over the
        role of este/esta — both are grammatically correct, but este is more
        common in formal writing while esse is what Brazilians actually say in
        conversation, even for something near the speaker. Aquele still firmly
        means 'far away' in both registers."
    explanation: "Grounded in the note's Modern Brazilian Portuguese section: 'Este
      is more common in formal writing. Esse is more common in conversation.'"
    source:
      note: "Grammar/Adjectives/Demonstrative Adjectives.md"
      heading: "4. Modern Brazilian Portuguese"
