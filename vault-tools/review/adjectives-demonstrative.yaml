  - type: explain_difference
    topic: Adjectives
    subtopic: Este vs esse — near me vs near you
    direction: null
    difficulty: medium
    register: neutral
    prompt: "In the exchange \"Você quer este livro?\" / \"Não, quero esse.\",
      explain what este and esse each point to."
    model_answers:
      - "Este livro refers to the book the first speaker is holding (near them).
        Esse in the reply refers back to that same book, but now from the second
        speaker's perspective it's 'the one near you' — esse marks something
        near the listener or just mentioned, in contrast to este for something
        near the speaker."
    explanation: "Grounded in the note's subtle-point dialogue distinguishing
      something near me from something near you."
