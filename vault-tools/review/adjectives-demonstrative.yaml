questions:
  - type: explain_difference
    topic: Adjectives
    subtopic: Este vs esse vs aquele — three-way distance system
    direction: null
    difficulty: medium
    register: neutral
    prompt: "Explain the three-way distance distinction that este, esse, and aquele
      express, which English's single word \"that\" doesn't fully capture."
    model_answers:
      - "Portuguese splits distance into three levels: este is used for
        something near the speaker (Este livro é interessante — the book I'm
        holding), esse is for something near the listener or already mentioned
        (Esse livro é novo — the book you're holding), and aquele is for
        something far from both speaker and listener (Aquele livro é antigo —
        the book across the room). English collapses este/esse into 'this/that'
        and aquele into 'that (over there)'."
    explanation: "Grounded in the note's room example distinguishing este, esse, and
      aquele."
    source:
      note: "Grammar/Adjectives/Demonstrative Adjectives.md"
      heading: "2. The three-way system"
    status: approved
